name: Android APK
on:
  push:
    branches: [android]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: false
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Build web interface and test modules
        run: |
          npm ci
          npm test
          npm run build:android
      - uses: actions/checkout@v5
        with:
          ref: android-apks
          path: prebuilt
      - name: Verify signed release APK
        run: |
          test "$(node -p 'require("./prebuilt/build-info.json").sourceCommit')" = "$GITHUB_SHA"
          cd prebuilt
          sha256sum -c SHA256SUMS.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs Nexo-IPTV-Android-0.1.0.apk | tee certificate.txt
          grep -q '42a49db518c4adf3ee8e22f471f03aad549b0cc0e1b91bf04360ad4f3de23389' certificate.txt
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test native Android playback and storage
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disk-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -camera-front none -memory 3072
          script: |
            cd android && ./gradlew connectedDebugAndroidTest --stacktrace
            adb install -r prebuilt/Nexo-IPTV-Android-0.1.0.apk
            adb shell am start -n com.nexo.iptv/com.nexo.iptv.MainActivity
            sleep 6
            mkdir -p artifacts
            adb shell uiautomator dump /sdcard/nexo-window.xml
            adb pull /sdcard/nexo-window.xml artifacts/android-release-window.xml
            grep -q 'Agregar cuenta' artifacts/android-release-window.xml
            adb exec-out screencap -p > artifacts/android-release-home.png
      - name: Report Android test failures
        if: always()
        run: node scripts/report-android-tests.mjs
      - name: Publish Android APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view android-v0.1.0 --repo "$GITHUB_REPOSITORY" || gh release create android-v0.1.0 --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "Nexo IPTV Android 0.1.0" --notes-file docs/ANDROID_RELEASE_NOTES.md --prerelease
          gh release upload android-v0.1.0 prebuilt/Nexo-IPTV-Android-0.1.0.apk prebuilt/SHA256SUMS.txt artifacts/android-release-home.png --repo "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
