plugins { id 'com.android.application' }
def androidVersion = new groovy.json.JsonSlurper().parse(rootProject.file('version.json'))
android {
    namespace 'com.nexo.iptv'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nexo.iptv'
        minSdk 26
        targetSdk 35
        versionCode androidVersion.code
        versionName androidVersion.name
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
    }
    signingConfigs {
        release {
            storeType 'PKCS12'
            if (System.getenv('NEXO_ANDROID_KEYSTORE')) {
                storeFile file(System.getenv('NEXO_ANDROID_KEYSTORE'))
                storePassword System.getenv('NEXO_ANDROID_STORE_PASSWORD')
                keyAlias 'nexo'
                keyPassword System.getenv('NEXO_ANDROID_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { applicationIdSuffix '.dev'; versionNameSuffix '-test' }
        release { minifyEnabled false; signingConfig signingConfigs.release }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    packaging { jniLibs { useLegacyPackaging true } }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'org.videolan.android:libvlc-all:3.6.5'
    androidTestImplementation 'androidx.test:core:1.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
