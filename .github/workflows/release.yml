name: Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/release.yml]
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.1.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Test playlist handling
        run: npm test
      - name: Package Windows application
        run: npm run package:win
      - name: Compress and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path release/Nexo-IPTV-win32-x64 -DestinationPath release/Nexo-IPTV-Windows11-x64.zip
          $hash = (Get-FileHash release/Nexo-IPTV-Windows11-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  Nexo-IPTV-Windows11-x64.zip" | Set-Content release/SHA256SUMS.txt -Encoding ascii
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload v0.1.0 release/Nexo-IPTV-Windows11-x64.zip release/SHA256SUMS.txt --repo ${{ github.repository }} --clobber
